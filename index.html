<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אַלּוּף הַהַכְתָּבוֹת</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;direction:rtl;color:#333}
.screen{display:none;min-height:100vh;padding:20px}
.screen.active{display:flex;align-items:center;justify-content:center}
.container{background:white;border-radius:30px;padding:40px 20px;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-width:500px;width:100%;text-align:center}
.logo h1{font-size:2.5em;color:#667eea;margin-bottom:10px}
.subtitle{font-size:1.2em;color:#764ba2;margin-bottom:40px}
.btn{border:none;border-radius:15px;padding:15px 30px;font-size:1.2em;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:bold;width:100%;justify-content:center;margin-bottom:15px}
.btn-primary{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;box-shadow:0 5px 15px rgba(102,126,234,0.4)}
.btn-primary:active{transform:scale(0.95)}
.btn-secondary{background:#f0f0f0;color:#666}
.btn-large{padding:20px 40px;font-size:1.5em}
.btn-icon{font-size:1.5em}
.progress-info{display:flex;justify-content:center;gap:30px;padding-top:20px;margin-top:20px;border-top:2px solid #f0f0f0}
.stars-count,.medals-count{display:flex;align-items:center;gap:8px;font-size:1.3em;font-weight:bold;color:#667eea}
</style>
</head>
<body>
<div id="welcomeScreen" class="screen active">
<div class="container">
<div class="logo"><h1>אַלּוּף הַהַכְתָּבוֹת</h1><p class="subtitle">מַסַּע עֲשֶׂרֶת הָאֲתַגְרִים</p></div>
<button id="startGame" class="btn btn-primary btn-large"><span class="btn-icon">🎮</span><span>הַתְחֵל מִשְׂחָק</span></button>
<button id="parentsArea" class="btn btn-secondary"><span class="btn-icon">👨‍👩‍👧</span><span>אֵזוֹר הוֹרִים</span></button>
<div class="progress-info">
<div class="stars-count"><span>⭐</span><span id="totalStars">0</span></div>
<div class="medals-count"><span>🏅</span><span id="totalMedals">0</span></div>
</div>
</div>
</div>
<div id="gameScreen" class="screen">
<div class="container">
<h1 id="stageTitle">שָׁלָב 1</h1>
<div id="gameArea"></div>
<button id="backButton" class="btn btn-secondary">🏠 חֲזָרָה</button>
</div>
</div>
<script>
const Storage={
getProgress:function(){try{const p=localStorage.getItem('progress');return p?JSON.parse(p):{currentStage:1,stars:0,medals:0}}catch(e){return{currentStage:1,stars:0,medals:0}}},
saveProgress:function(p){try{localStorage.setItem('progress',JSON.stringify(p))}catch(e){}},
addStars:function(n){const p=this.getProgress();p.stars+=n;this.saveProgress(p)},
addMedal:function(){const p=this.getProgress();p.medals++;this.saveProgress(p)},
getWords:function(){return[{id:1,word:'מִטְרִיָּה',plain:'מטריה'},{id:2,word:'מַמְטֵרָה',plain:'ממטרה'},{id:3,word:'טִפָּה',plain:'טיפה'},{id:4,word:'רָטֹב',plain:'רטוב'},{id:5,word:'טוֹבֵעַ',plain:'טובע'},{id:6,word:'טַל',plain:'טל'},{id:7,word:'אַמְבַּטְיָה',plain:'אמבטיה'},{id:8,word:'שִׁטָּפוֹן',plain:'שיטפון'},{id:9,word:'שָׁט',plain:'שט'},{id:10,word:'מָשׁוֹט',plain:'משוט'}]}
};

const Game={
currentStage:1,
init:function(){
const p=Storage.getProgress();
this.currentStage=p.currentStage||1;
this.showScreen('gameScreen');
document.getElementById('stageTitle').textContent='שָׁלָב '+this.currentStage;
document.getElementById('gameArea').innerHTML='<p style="font-size:1.5em;margin:20px;">המשחק בטעינה...</p>';
setTimeout(()=>this.loadStage(this.currentStage),500);
},
loadStage:function(n){
document.getElementById('gameArea').innerHTML='<p style="font-size:1.5em;margin:20px;">שָׁלָב '+n+' - בקרוב!</p>';
},
showScreen:function(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
},
updateStats:function(){
const p=Storage.getProgress();
document.getElementById('totalStars').textContent=p.stars||0;
document.getElementById('totalMedals').textContent=p.medals||0;
}
};

document.addEventListener('DOMContentLoaded',function(){
console.log('App loaded');
document.getElementById('startGame').addEventListener('click',function(){
console.log('Start clicked');
Game.init();
});
document.getElementById('parentsArea').addEventListener('click',function(){
alert('אזור הורים - בקרוב!');
});
document.getElementById('backButton').addEventListener('click',function(){
Game.showScreen('welcomeScreen');
Game.updateStats();
});
Game.updateStats();
});
</script>
</body>
</html>
