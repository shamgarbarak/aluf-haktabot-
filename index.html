<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>אַלּוּף הַהַכְתָּבוֹת</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; direction: rtl; color: #333; overflow-x: hidden; }
        .screen { display: none; min-height: 100vh; padding: 20px; }
        .screen.active { display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 30px; padding: 40px 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; text-align: center; }
        .logo h1 { font-size: 2.5em; color: #667eea; margin-bottom: 10px; }
        .subtitle { font-size: 1.2em; color: #764ba2; margin-bottom: 40px; }
        .btn { border: none; border-radius: 15px; padding: 15px 30px; font-size: 1.2em; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 10px; font-weight: bold; width: 100%; justify-content: center; margin-bottom: 15px; user-select: none; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .btn-primary:active { transform: scale(0.95); }
        .btn-secondary { background: #f0f0f0; color: #666; }
        .btn-large { padding: 20px 40px; font-size: 1.5em; }
        .btn-icon { font-size: 1.5em; }
        .progress-info { display: flex; justify-content: center; gap: 30px; padding-top: 20px; margin-top: 20px; border-top: 2px solid #f0f0f0; }
        .stars-count, .medals-count { display: flex; align-items: center; gap: 8px; font-size: 1.3em; font-weight: bold; color: #667eea; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #f0f0f0; flex-wrap: wrap; gap: 10px; }
        .stage-title { font-size: 1.5em; color: #667eea; }
        .stage-progress { display: flex; gap: 8px; flex-wrap: wrap; }
        .progress-dot { width: 12px; height: 12px; border-radius: 50%; background: #e0e0e0; }
        .progress-dot.active { background: #667eea; }
        .progress-dot.completed { background: #4CAF50; }
        .game-area { min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .instruction { font-size: 1.3em; color: #666; margin-bottom: 10px; }
        .word-display { font-size: 2.5em; font-weight: bold; color: #333; padding: 20px; background: #f8f9fa; border-radius: 15px; min-width: 250px; text-align: center; }
        .word-input { width: 100%; padding: 15px; font-size: 1.5em; border: 3px solid #e0e0e0; border-radius: 15px; text-align: center; direction: rtl; }
        .word-input:focus { outline: none; border-color: #667eea; }
        .play-button { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; color: white; font-size: 3em; cursor: pointer; box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .play-button:active { transform: scale(0.95); }
        .feedback { padding: 20px; border-radius: 15px; font-size: 1.2em; font-weight: bold; text-align: center; animation: fadeIn 0.5s; width: 100%; }
        .feedback.success { background: #d4edda; color: #155724; border: 2px solid #c3e6cb; }
        .feedback.error { background: #f8d7da; color: #721c24; border: 2px solid #f5c6cb; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; margin: 20px 0; }
        .option-btn { font-size: 1.3em; padding: 20px; min-height: 60px; }
        .letter-btn { font-size: 2em; width: 60px; height: 60px; padding: 0; display: flex; align-items: center; justify-content: center; }
        #answerSlots { background: #e3f2fd; border: 3px dashed #667eea; color: #333; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; min-height: 80px; letter-spacing: 10px; }
        #writingCanvas { border: 3px dashed #667eea; border-radius: 15px; background: #f8f9fa; touch-action: none; max-width: 100%; width: 300px; height: 200px; }
        .champion-certificate { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%); border-radius: 20px; border: 5px solid #ffd700; animation: popIn 0.6s cubic-bezier(0.68,-0.55,0.265,1.55); }
        .champion-certificate h1 { font-size: 2.5em; color: #f57f17; margin-bottom: 20px; }
        .certificate-stats { font-size: 1.3em; margin: 30px 0; color: #333; }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .pin-input { width: 200px; padding: 15px; font-size: 2em; text-align: center; border: 3px solid #e0e0e0; border-radius: 15px; margin-bottom: 20px; }
        .word-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .word-info { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .word-niqqud { font-size: 1.5em; font-weight: bold; color: #667eea; }
        .word-plain { font-size: 1em; color: #666; }
        .word-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-small { padding: 8px 15px; font-size: 0.9em; width: auto; margin: 0; }
        .btn-warning { background: #ff9800; color: white; }
        .recording-active { background: #ff4444 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .parents-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 10px; }
        .parents-actions { display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .parents-actions .btn { flex: 1; min-width: 150px; }
        .feedback-section { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 15px; }
        .feedback-section h3 { margin-bottom: 15px; color: #667eea; }
        .feedback-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; margin-bottom: 10px; background: white; border-radius: 10px; border: 2px solid #e0e0e0; }
        .status-bar { position: fixed; top: 0; left: 0; right: 0; padding: 8px 15px; font-size: 12px; text-align: center; z-index: 1000; font-family: monospace; }
        .status-bar.ok { background: #d4edda; color: #155724; }
        .status-bar.warning { background: #fff3cd; color: #856404; }
        .debug-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.95); color: #0f0; padding: 10px; font-family: monospace; font-size: 11px; max-height: 40vh; overflow-y: auto; display: none; z-index: 9999; direction: ltr; text-align: left; }
        .debug-panel.active { display: block; }
        .debug-toggle { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; z-index: 10000; cursor: pointer; }
        .round-indicator { background: #667eea; color: white; padding: 8px 20px; border-radius: 20px; font-size: 0.9em; margin-bottom: 10px; }
        .reset-btn { background: #ff6b6b; color: white; border: none; padding: 10px 20px; border-radius: 15px; font-size: 1em; margin-top: 15px; cursor: pointer; }
        @media (max-width: 480px) { .container { padding: 30px 15px; } .logo h1 { font-size: 2em; } .word-display { font-size: 2em; } .play-button { width: 80px; height: 80px; font-size: 2.5em; } }
    </style>
</head>
<body>
    <button class="debug-toggle" id="debugToggle" style="display:none;">🔧</button>
    <div class="status-bar" id="statusBar"></div>
    <div id="welcomeScreen" class="screen active">
        <div class="container">
            <div class="logo"><h1>אַלּוּף הַהַכְתָּבוֹת</h1><p class="subtitle">מַסַּע עֲשֶׂרֶת הָאֲתַגְרִים</p></div>
            <button id="startGame" class="btn btn-primary btn-large"><span class="btn-icon">🎮</span><span>הַתְחֵל מִשְׂחָק</span></button>
            <button id="parentsArea" class="btn btn-secondary"><span class="btn-icon">👨‍👩‍👧</span><span>אֵזוֹר הוֹרִים</span></button>
            <button id="quickReset" class="reset-btn">🔄 אִפּוּס מָהִיר</button>
            <div class="progress-info">
                <div class="stars-count"><span>⭐</span><span id="totalStars">0</span></div>
                <div class="medals-count"><span>🏅</span><span id="totalMedals">0</span></div>
            </div>
        </div>
    </div>
    <div id="gameScreen" class="screen">
        <div class="container">
            <div class="game-header"><h1 class="stage-title" id="stageTitle">שָׁלָב 1</h1><div class="stage-progress" id="stageProgress"></div></div>
            <div class="game-area" id="gameArea"></div>
            <button id="backButton" class="btn btn-secondary"><span class="btn-icon">🏠</span><span>חֲזָרָה לַתַּפְרִיט</span></button>
        </div>
    </div>
    <div id="parentsScreen" class="screen">
        <div class="container">
            <div id="pinScreen">
                <h2>אזור הורים</h2><p>הזן קוד PIN כדי להמשיך</p>
                <input type="password" class="pin-input" id="pinInput" maxlength="4" placeholder="****">
                <button class="btn btn-primary" id="enterPin">כניסה</button>
                <button class="btn btn-secondary" id="setPin">הגדר קוד חדש</button>
            </div>
            <div id="parentsAreaContent" style="display:none;">
                <div class="parents-header"><h1>ניהול מילים ופידבקים</h1><button class="btn btn-secondary btn-small" id="logoutButton">יציאה</button></div>
                <h3 style="margin-bottom:15px;color:#667eea;">מילים</h3>
                <div id="wordsList"></div>
                <div class="feedback-section">
                    <h3>פידבקים קוליים</h3>
                    <p style="margin-bottom:15px;font-size:0.9em;color:#666;">הקלט פידבקים מותאמים או השתמש בברירת המחדל</p>
                    <div id="feedbacksList"></div>
                </div>
                <div class="parents-actions">
                    <button class="btn btn-primary" id="addWordButton"><span class="btn-icon">➕</span><span>הוסף מילה</span></button>
                    <button class="btn btn-secondary" id="viewStatsButton"><span class="btn-icon">📊</span><span>סטטיסטיקות</span></button>
                    <button class="btn btn-secondary" id="resetButton"><span class="btn-icon">🔄</span><span>אפס</span></button>
                </div>
            </div>
        </div>
    </div>
    <div id="debugPanel" class="debug-panel"></div>
    <script>
        const Debug = { enabled: true, logs: [], log: function(m, d) { const t = new Date().toLocaleTimeString(); this.logs.push({t, m, d, type:'info'}); console.log(`[${t}] ${m}`, d||''); this.render(); }, error: function(m, e) { const t = new Date().toLocaleTimeString(); this.logs.push({t, m, d:e, type:'error'}); console.error(`[${t}] ${m}`, e); this.render(); }, render: function() { const p = document.getElementById('debugPanel'); if (!p || !p.classList.contains('active')) return; p.innerHTML = this.logs.slice(-100).map(e => `<div style="color:${e.type==='error'?'#ff6b6b':'#0f0'}">[${e.t}] ${e.m}${e.d?' '+JSON.stringify(e.d):''}</div>`).join(''); p.scrollTop = p.scrollHeight; } };
        document.getElementById('debugToggle').addEventListener('click', () => document.getElementById('debugPanel').classList.toggle('active'));
        let tapCount = 0, tapTimer = null;
        document.addEventListener('click', function(e) { if (e.target.closest('.container') || e.target.closest('.debug-toggle')) return; tapCount++; if (tapCount >= 3) { document.getElementById('debugToggle').style.display = 'block'; document.getElementById('debugPanel').classList.add('active'); tapCount = 0; } clearTimeout(tapTimer); tapTimer = setTimeout(() => tapCount = 0, 500); });
        const Storage = { getProgress: function() { try { const p = localStorage.getItem('tanach_progress'); return p ? JSON.parse(p) : { currentStage: 1, stars: 0, medals: 0, completedStages: [], wordStats: {} }; } catch(e) { return { currentStage: 1, stars: 0, medals: 0, completedStages: [], wordStats: {} }; } }, saveProgress: function(p) { try { localStorage.setItem('tanach_progress', JSON.stringify(p)); } catch(e) {} }, addStars: function(n) { const p = this.getProgress(); p.stars += n; this.saveProgress(p); }, addMedal: function() { const p = this.getProgress(); p.medals++; this.saveProgress(p); }, completeStage: function(n) { const p = this.getProgress(); if (!p.completedStages.includes(n)) { p.completedStages.push(n); p.currentStage = Math.max(p.currentStage, n+1); } this.saveProgress(p); }, getWords: function() { try { const w = localStorage.getItem('tanach_words'); if (w) return JSON.parse(w); } catch(e) {} const d = [{id:1,word:'מִטְרִיָּה',plain:'מטריה'},{id:2,word:'מַמְטֵרָה',plain:'ממטרה'},{id:3,word:'טִפָּה',plain:'טיפה'},{id:4,word:'רָטֹב',plain:'רטוב'},{id:5,word:'טוֹבֵעַ',plain:'טובע'},{id:6,word:'טַל',plain:'טל'},{id:7,word:'אַמְבַּטְיָה',plain:'אמבטיה'},{id:8,word:'שִׁטָּפוֹן',plain:'שיטפון'},{id:9,word:'שָׁט',plain:'שט'},{id:10,word:'מָשׁוֹט',plain:'משוט'}]; this.saveWords(d); return d; }, saveWords: function(w) { try { localStorage.setItem('tanach_words', JSON.stringify(w)); } catch(e) {} }, updateWord: function(id, u) { const w = this.getWords(); const i = w.findIndex(x => x.id === id); if (i !== -1) { w[i] = {...w[i], ...u}; this.saveWords(w); } }, updateWordStats: function(id, c) { const p = this.getProgress(); if (!p.wordStats[id]) p.wordStats[id] = {attempts:0,correct:0}; p.wordStats[id].attempts++; if (c) p.wordStats[id].correct++; this.saveProgress(p); }, getDifficultWords: function() { const p = this.getProgress(); return this.getWords().filter(w => { const s = p.wordStats[w.id]; return s && s.attempts >= 3 && (s.correct/s.attempts) < 0.7; }); }, resetProgress: function() { localStorage.removeItem('tanach_progress'); }, getParentPIN: function() { return localStorage.getItem('tanach_parent_pin'); }, setParentPIN: function(p) { localStorage.setItem('tanach_parent_pin', p); }, getFeedbacks: function() { try { const f = localStorage.getItem('tanach_feedbacks'); if (f) return JSON.parse(f); } catch(e) {} const d = {success:[{id:'s1',text:'כָּל הַכָּבוֹד! הִצְלַחְתָּ!'},{id:'s2',text:'מְצֻיָּן!'},{id:'s3',text:'אֵיזֶה יֹפִי!'}],error:[{id:'e1',text:'כִּמְעַט! בֹּא נְנַסֶּה שׁוּב'},{id:'e2',text:'לֹא נוֹרָא, נַסֵּה שׁוּב'},{id:'e3',text:'כִּמְעַט, עוֹד נִסָּיוֹן'}]}; this.saveFeedbacks(d); return d; }, saveFeedbacks: function(f) { try { localStorage.setItem('tanach_feedbacks', JSON.stringify(f)); } catch(e) {} } };
        const AudioDB = { db: null, available: false, init: function() { return new Promise(r => { if (!window.indexedDB) { r(false); return; } try { const req = indexedDB.open('TanachAudioDB', 1); req.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains('recordings')) db.createObjectStore('recordings', {keyPath:'id'}); }; req.onsuccess = e => { this.db = e.target.result; this.available = true; r(true); }; req.onerror = () => r(false); } catch(e) { r(false); } }); }, save: function(id, blob) { if (!this.available) return Promise.resolve(false); return new Promise(r => { try { const tx = this.db.transaction(['recordings'],'readwrite'); tx.objectStore('recordings').put({id,blob}); tx.oncomplete = () => r(true); tx.onerror = () => r(false); } catch(e) { r(false); } }); }, get: function(id) { if (!this.available) return Promise.resolve(null); return new Promise(r => { try { const tx = this.db.transaction(['recordings'],'readonly'); const req = tx.objectStore('recordings').get(id); req.onsuccess = () => r(req.result ? req.result.blob : null); req.onerror = () => r(null); } catch(e) { r(null); } }); } };
        const SpeechEngine = { synth: window.speechSynthesis, hebrewVoice: null, available: false, speaking: false, init: function() { return new Promise(r => { if (!this.synth) { r(); return; } const load = () => { const v = this.synth.getVoices(); if (v.length > 0) { this.hebrewVoice = v.find(x => x.lang && x.lang.includes('he')) || v[0]; this.available = true; } r(); }; if (this.synth.getVoices().length > 0) load(); else { this.synth.onvoiceschanged = load; setTimeout(load, 1500); } }); }, wakeUp: function() { if (!this.synth) return; try { const u = new SpeechSynthesisUtterance(''); u.volume = 0; this.synth.speak(u); } catch(e) {} }, speak: function(text) { return new Promise(r => { if (!this.synth) { r(); return; } if (this.speaking) { setTimeout(() => this.speak(text).then(r), 300); return; } this.speaking = true; try { this.synth.cancel(); this.wakeUp(); setTimeout(() => { try { const u = new SpeechSynthesisUtterance(text); u.lang = 'he-IL'; u.rate = 0.9; u.pitch = 1.1; if (this.hebrewVoice) u.voice = this.hebrewVoice; u.onend = () => { this.speaking = false; r(); }; u.onerror = () => { this.speaking = false; r(); }; this.synth.speak(u); setTimeout(() => { if (this.speaking) { this.speaking = false; r(); } }, 8000); } catch(e) { this.speaking = false; r(); } }, 100); } catch(e) { this.speaking = false; r(); } }); } };
